name: ChatGPT PR 2372 verify current

on:
  push:
    branches:
      - chatgpt-pr2372-runner

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard and checkout current PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/issue-1840-release-key-on-definite-failure
          ACTUAL_PR_HEAD="$(git rev-parse FETCH_HEAD)"
          echo "PR head: $ACTUAL_PR_HEAD"
          test "$ACTUAL_PR_HEAD" = "a34cd4af8cb756af6a35324fdcd8f2fe1af67121"
          git checkout --detach "$ACTUAL_PR_HEAD"

          git fetch https://github.com/KeeperHub/keeperhub.git staging
          ACTUAL_STAGING="$(git rev-parse FETCH_HEAD)"
          echo "staging: $ACTUAL_STAGING"
          test "$ACTUAL_STAGING" = "a26b7dbb10ac9886730a4ac31c8c938000fbb2dd"

          git diff --check a26b7dbb10ac9886730a4ac31c8c938000fbb2dd...HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate gitignored plugin registries
        run: pnpm discover-plugins

      - name: Run required focused tests
        run: >-
          pnpm vitest run
          tests/unit/tempo-broadcast-due.test.ts
          tests/unit/tempo-broadcast-stored.test.ts
          tests/unit/submit-signed.test.ts
          tests/unit/evm-chain-adapter-tempo-confirm.test.ts
          tests/unit/broadcast-attempted-core-evidence.test.ts
          tests/unit/execute-protocol-idempotency-disposition.test.ts
          tests/unit/execution-service-safe-inner-failure.test.ts
          tests/unit/idempotency-disposition-evidence.test.ts
          tests/integration/execute-node-reserved-fields.test.ts

      - name: Type check
        run: pnpm type-check

      - name: Biome required changed files
        run: >-
          pnpm biome check
          app/api/execute/'[...slug]'/route.ts
          app/api/execute/_lib/execution-service.ts
          app/api/execute/node/route.ts
          docs/api/direct-execution.md
          lib/idempotency.ts
          lib/tempo/broadcast-due.ts
          lib/tempo/held-payments.ts
          lib/web3/chain-adapter/evm.ts
          lib/web3/submit-signed.ts
          plugins/tempo/steps/tempo-tx-core.ts
          specs/api-coverage.json
          tests/integration/execute-node-reserved-fields.test.ts
          tests/unit/tempo-broadcast-due.test.ts
          tests/unit/submit-signed.test.ts
          tests/unit/evm-chain-adapter-tempo-confirm.test.ts
          tests/unit/broadcast-attempted-core-evidence.test.ts
