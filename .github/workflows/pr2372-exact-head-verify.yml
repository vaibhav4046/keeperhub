name: PR 2372 final no-regression verification

on:
  push:
    branches:
      - automation/pr2372-verify-db2f3a8

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cf644f856f58ea83b6b62997856410f683a9f6e
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate baseline registry
        run: pnpm discover-plugins

      - name: Full unit baseline on exact PR HEAD
        id: baseline
        shell: bash
        run: |
          set +e
          pnpm vitest run tests/unit --reporter=json --outputFile=/tmp/baseline.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/baseline.json'))
          files=[]
          for r in d.get('testResults', []):
              failed = r.get('status') == 'failed' or any(a.get('status') == 'failed' for a in r.get('assertionResults', []))
              if failed:
                  files.append(r.get('name','<unknown>'))
          files=sorted(set(files))
          Path('/tmp/baseline-failed-files.txt').write_text('\n'.join(files) + ('\n' if files else ''))
          print(f'BASELINE_STATUS={d.get("success")} failed_files={len(files)}')
          for f in files: print('BASELINE_FAIL', f)
          PY

      - name: Apply only the previously green broadcaster hardening
        run: |
          paths=(
            app/api/execute/transfer/route.ts
            docs/api/direct-execution.md
            lib/web3/submit-signed.ts
            plugins/robinhood/steps/trade-stock-token-core.ts
            plugins/tempo/steps/batch-payout.ts
            plugins/tempo/steps/dex-swap.ts
            plugins/tempo/steps/tempo-tx-core.ts
            plugins/tempo/steps/transfer-with-memo.ts
            plugins/web3/steps/approve-token-core.ts
            plugins/web3/steps/batch-write-contract-core.ts
            plugins/web3/steps/transfer-funds-core.ts
            plugins/web3/steps/transfer-spl-token-core.ts
            plugins/web3/steps/transfer-token-core.ts
            plugins/web3/steps/write-contract-core.ts
            tests/unit/idempotency.test.ts
            tests/unit/transfer-spl-token.test.ts
            tests/unit/write-contract-core.test.ts
          )
          git diff db2f3a8fd98d115acd8b31b9d00991f42994cf53..260231ee8530debe6a209b9b99dce0850cbb5aad -- "${paths[@]}" > /tmp/hardening.patch
          test -s /tmp/hardening.patch
          git apply --index --3way /tmp/hardening.patch
          git diff --cached --check
          printf '%s\n' "${paths[@]}" | sort > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Generate candidate registry
        run: pnpm discover-plugins

      - name: Reviewer safety regression matrix
        run: >-
          pnpm vitest run
          tests/unit/idempotency-disposition-evidence.test.ts
          tests/unit/execute-protocol-idempotency-disposition.test.ts
          tests/unit/execution-service-safe-inner-failure.test.ts
          tests/unit/idempotency.test.ts
          tests/unit/submit-signed.test.ts
          tests/unit/write-contract-core.test.ts
          tests/unit/approve-token.test.ts
          tests/unit/batch-write-contract.test.ts
          tests/unit/robinhood-trade-stock-token.test.ts
          tests/unit/transfer-spl-token.test.ts
          tests/unit/transfer-token-core.test.ts
          tests/unit/tempo-dex-swap.test.ts
          tests/unit/tempo-batch-payout.test.ts
          tests/unit/tempo-transfer-with-memo.test.ts

      - name: Type check
        run: pnpm type-check

      - name: Biome final source set
        run: |
          mapfile -t changed < <(git diff --cached --name-only --diff-filter=ACMR | grep -E '\.(ts|tsx|js|jsx|json)$' || true)
          changed+=(lib/idempotency-disposition.ts tests/unit/idempotency-disposition-evidence.test.ts)
          pnpm biome check "${changed[@]}"

      - name: API docs validation
        run: pnpm check:api-docs

      - name: Full unit candidate with concise failure capture
        id: candidate
        shell: bash
        run: |
          set +e
          pnpm vitest run tests/unit --reporter=json --outputFile=/tmp/candidate.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/candidate.json'))
          files=[]
          for r in d.get('testResults', []):
              failed = r.get('status') == 'failed' or any(a.get('status') == 'failed' for a in r.get('assertionResults', []))
              if failed:
                  files.append(r.get('name','<unknown>'))
          files=sorted(set(files))
          Path('/tmp/candidate-failed-files.txt').write_text('\n'.join(files) + ('\n' if files else ''))
          print(f'CANDIDATE_STATUS={d.get("success")} failed_files={len(files)}')
          for f in files: print('CANDIDATE_FAIL', f)
          PY

      - name: Require no new full-suite failures
        run: |
          echo '--- baseline failures ---'
          cat /tmp/baseline-failed-files.txt || true
          echo '--- candidate failures ---'
          cat /tmp/candidate-failed-files.txt || true
          new_failures=$(comm -13 /tmp/baseline-failed-files.txt /tmp/candidate-failed-files.txt || true)
          if [[ -n "$new_failures" ]]; then
            echo 'Candidate introduced new failing unit files:'
            echo "$new_failures"
            exit 1
          fi
          if [[ "${{ steps.candidate.outputs.status }}" == "0" ]]; then
            echo 'FULL_UNIT_RESULT=green'
          else
            echo 'FULL_UNIT_RESULT=baseline-only failures; zero new failing files'
          fi

      - name: Final tree safety
        run: |
          git diff --cached --check
          git diff --exit-code
          printf '%s\n' \
            app/api/execute/transfer/route.ts \
            docs/api/direct-execution.md \
            lib/web3/submit-signed.ts \
            plugins/robinhood/steps/trade-stock-token-core.ts \
            plugins/tempo/steps/batch-payout.ts \
            plugins/tempo/steps/dex-swap.ts \
            plugins/tempo/steps/tempo-tx-core.ts \
            plugins/tempo/steps/transfer-with-memo.ts \
            plugins/web3/steps/approve-token-core.ts \
            plugins/web3/steps/batch-write-contract-core.ts \
            plugins/web3/steps/transfer-funds-core.ts \
            plugins/web3/steps/transfer-spl-token-core.ts \
            plugins/web3/steps/transfer-token-core.ts \
            plugins/web3/steps/write-contract-core.ts \
            tests/unit/idempotency.test.ts \
            tests/unit/transfer-spl-token.test.ts \
            tests/unit/write-contract-core.test.ts | sort > /tmp/expected-final
          git diff --cached --name-only | sort > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final
          git diff --cached --stat

      - name: Publish verified combined candidate
        run: |
          git config user.name "Vaibhav Lalwani"
          git config user.email "115102797+vaibhav4046@users.noreply.github.com"
          git switch -c automation/pr2372-verified-result-v2
          git commit -m "fix: harden idempotency broadcast evidence for #1840"
          git push --force-with-lease origin HEAD:automation/pr2372-verified-result-v2
