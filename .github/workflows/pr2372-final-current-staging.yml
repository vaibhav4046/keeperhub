name: PR2372 Final Current Staging
on:
  push:
    branches: [verify/pr2372-final-current-staging-20260916]
permissions:
  contents: write
env:
  OLD_BASE: 75f25e7d8c39b54dc1becc13fad64fa986560192
  CURRENT_BASE: 978b916aacb223cd08abe8318a0b6ec58efb42fc
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: keeperhub_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keeperhub_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c4cfcfff05730787f05c4d88cc9cf41146a069f4
          fetch-depth: 0
      - name: Apply reviewed fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin verify/pr2372-review4-fix-v2-20260916
          git show origin/verify/pr2372-review4-fix-v2-20260916:.github/workflows/pr2372-review4-fix-v2.yml > /tmp/v2.yml
          ruby -ryaml -e 'y=YAML.safe_load(File.read("/tmp/v2.yml"), aliases: true); s=y["jobs"]["verify"]["steps"].find{|x| x["name"]=="Apply exact fixes"}; File.write("/tmp/apply.sh", s["run"])'
          bash /tmp/apply.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/unit/solana-broadcast-evidence.test.ts')
          t=p.read_text()
          p.write_text(t.replace('lamports:0n','lamports:BigInt(0)',1))
          PY
          git add app/api/execute/node/route.ts plugins/web3/steps/send-raw-solana-instruction-core.ts plugins/web3/steps/call-solana-program-core.ts plugins/web3/steps/write-contract-core.ts tests/unit/execute-node-idempotency-disposition.test.ts tests/unit/solana-broadcast-evidence.test.ts
          git commit -m 'fix: require adjudicated node evidence before release'
      - name: Rebase onto current staging
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KeeperHub/keeperhub.git
          git fetch upstream "$CURRENT_BASE"
          if ! GIT_EDITOR=true git rebase --onto "$CURRENT_BASE" "$OLD_BASE"; then
            while test -d .git/rebase-merge || test -d .git/rebase-apply; do
              conflicts="$(git diff --name-only --diff-filter=U)"
              test "$conflicts" = 'specs/api-coverage.json' || { echo "Unexpected conflict: $conflicts"; exit 1; }
              git checkout --ours specs/api-coverage.json
              git add specs/api-coverage.json
              if git diff --cached --quiet; then GIT_EDITOR=true git rebase --skip || true; else GIT_EDITOR=true git rebase --continue || true; fi
            done
          fi
          test "$(git merge-base HEAD "$CURRENT_BASE")" = "$CURRENT_BASE"
      - uses: ./.github/actions/setup-node-pnpm
        with: { discover-plugins: 'true' }
      - name: Normalize generated content
        run: |
          pnpm exec biome check --write --unsafe tests/unit/execute-node-idempotency-disposition.test.ts tests/unit/solana-broadcast-evidence.test.ts
          pnpm check:api-docs
          pnpm check:api-docs
          git diff --check
      - name: Regression mutation proof
        run: |
          set -euo pipefail
          cp app/api/execute/node/route.ts /tmp/fixed-node
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/execute/node/route.ts'); t=p.read_text()
          a='transactionHash && chainId !== undefined\n        ? dispositionForExecutionOutcome'
          b='completeParams.transactionHash && completeParams.chainId !== undefined\n        ? dispositionForExecutionOutcome'
          if t.count(a)!=1 or t.count(b)!=1: raise SystemExit('safe guards missing')
          p.write_text(t.replace(a,'transactionHash\n        ? dispositionForExecutionOutcome',1).replace(b,'completeParams.transactionHash\n        ? dispositionForExecutionOutcome',1))
          PY
          set +e
          pnpm exec vitest run tests/unit/execute-node-idempotency-disposition.test.ts
          code=$?
          set -e
          mv /tmp/fixed-node app/api/execute/node/route.ts
          test "$code" -ne 0
      - name: Focused safety tests
        run: pnpm exec vitest run tests/unit/execute-node-idempotency-disposition.test.ts tests/unit/solana-broadcast-evidence.test.ts tests/unit/idempotency-disposition-evidence.test.ts tests/unit/idempotency.test.ts tests/unit/execute-protocol-idempotency-disposition.test.ts tests/unit/execution-service-safe-inner-failure.test.ts tests/unit/submit-signed.test.ts tests/unit/transfer-spl-token.test.ts tests/unit/write-contract-core.test.ts
      - name: Quality gates
        run: |
          pnpm check
          pnpm check:api-docs
          pnpm type-check
          pnpm type-check:executor
          git diff --check
      - name: Full unit suite
        run: pnpm test:unit __tests__ keeperhub-metrics-collector
      - name: Database suite
        run: |
          pnpm db:migrate
          pnpm test:db
      - name: Integration suite
        env: { CHAIN_RPC_CONFIG: '' }
        run: pnpm test:integration
      - name: Docker app build
        uses: docker/bake-action@v7
        env:
          ECR_REGISTRY: ''
          ECR_REPO: ''
        with:
          files: docker-bake.hcl
          targets: app
          push: false
      - name: Final safety gate and publish verified candidate
        run: |
          set -euo pipefail
          pnpm check:api-docs
          git diff --check
          test "$(git merge-base HEAD "$CURRENT_BASE")" = "$CURRENT_BASE"
          grep -F 'transactionHash && chainId !== undefined' app/api/execute/node/route.ts
          grep -F 'completeParams.transactionHash && completeParams.chainId !== undefined' app/api/execute/node/route.ts
          grep -F 'broadcastAttempted: true' plugins/web3/steps/send-raw-solana-instruction-core.ts
          grep -F 'broadcastAttempted: true' plugins/web3/steps/call-solana-program-core.ts
          if git diff --name-only "$CURRENT_BASE" | xargs -r grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- 2>/dev/null; then exit 1; fi
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore: refresh generated verification artifacts'; fi
          git push origin HEAD:verify/pr2372-final-verified-result2-20260916
          echo "RESULT_HEAD=$(git rev-parse HEAD)"
