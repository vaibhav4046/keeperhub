name: PR2372 Exact Merge Build

on:
  push:
    branches:
      - verify/pr2372-exact-merge-build-20260917

permissions:
  contents: read

jobs:
  exact-merge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KeeperHub/keeperhub
          ref: 79bc376b8c674552d07e78c14c1738831d22e770
      - name: Verify exact synthetic merge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "79bc376b8c674552d07e78c14c1738831d22e770"
          test "$(git rev-parse HEAD^1)" = "7104df9db8d2f171731185c6349855b59136e147"
          test "$(git rev-parse HEAD^2)" = "125536345b347c9cf5da4da279b4c883cd09ceed"
          git diff --check 7104df9db8d2f171731185c6349855b59136e147...HEAD
      - uses: docker/setup-buildx-action@v4
      - name: Build exact synthetic merge tree
        uses: docker/bake-action@v7
        env:
          ECR_REGISTRY: ''
          ECR_REPO: ''
          NEXT_PUBLIC_AUTH_PROVIDERS: ''
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ''
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''
          NEXT_PUBLIC_BILLING_ENABLED: ''
          NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED: ''
          NEXT_PUBLIC_SENTRY_DSN: ''
        with:
          source: https://github.com/KeeperHub/keeperhub.git#79bc376b8c674552d07e78c14c1738831d22e770
          files: docker-bake.hcl
          targets: app
          push: false
