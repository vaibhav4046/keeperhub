name: PR 2372 final hardening rerun

on:
  push:
    branches:
      - automation/pr2372-final-hardening-rerun-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1840-release-key-on-definite-failure
          fetch-depth: 0

      - name: Require unchanged feature head
        run: |
          set -euo pipefail
          expected=c4cfcfff05730787f05c4d88cc9cf41146a069f4
          test "$(git rev-parse HEAD)" = "$expected"
          remote_head="$(git ls-remote origin refs/heads/fix/issue-1840-release-key-on-definite-failure | cut -f1)"
          test "$remote_head" = "$expected"

      - name: Replay previously verified hardening patch
        run: |
          set -euo pipefail
          git fetch origin automation/pr2372-final-hardening-20260917
          python <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          source = subprocess.check_output(
              ["git", "show", "0143a926edbece4e9916623004cb57c9f604560e:.github/workflows/pr2372-final-hardening.yml"],
              text=True,
          )
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch_script = textwrap.dedent(source[start:end])
          Path("/tmp/pr2372-hardening.py").write_text(patch_script)
          subprocess.run(["python", "/tmp/pr2372-hardening.py"], check=True)
          PY
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and discover
        run: |
          pnpm install --frozen-lockfile
          pnpm discover-plugins

      - name: Focused regressions
        run: |
          pnpm exec vitest run \
            tests/integration/execute-node-reserved-fields.test.ts \
            tests/unit/execution-service-safe-inner-failure.test.ts \
            tests/unit/send-raw-solana-instruction.test.ts \
            tests/unit/call-solana-program.test.ts \
            tests/unit/idempotency-disposition-evidence.test.ts \
            tests/unit/idempotency.test.ts \
            tests/unit/execute-protocol-idempotency-disposition.test.ts \
            tests/unit/submit-signed.test.ts \
            tests/unit/transfer-spl-token.test.ts \
            tests/unit/write-contract-core.test.ts

      - name: Typecheck and API docs
        run: |
          set -euo pipefail
          pnpm type-check
          pnpm check:api-docs
          before="$(git diff -- specs/api-coverage.json | sha256sum | cut -d' ' -f1)"
          pnpm check:api-docs
          after="$(git diff -- specs/api-coverage.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"

      - name: Formatting and diff safety
        run: |
          set -euo pipefail
          pnpm exec biome check \
            app/api/execute/node/route.ts \
            app/api/execute/_lib/execution-service.ts \
            plugins/web3/steps/send-raw-solana-instruction-core.ts \
            plugins/web3/steps/call-solana-program-core.ts \
            plugins/web3/steps/write-contract-core.ts \
            tests/integration/execute-node-reserved-fields.test.ts \
            tests/unit/execution-service-safe-inner-failure.test.ts \
            tests/unit/send-raw-solana-instruction.test.ts \
            tests/unit/call-solana-program.test.ts
          pnpm exec prettier --check \
            plugins/web3/steps/send-raw-solana-instruction-core.ts \
            plugins/web3/steps/call-solana-program-core.ts \
            tests/integration/execute-node-reserved-fields.test.ts \
            tests/unit/execution-service-safe-inner-failure.test.ts \
            tests/unit/send-raw-solana-instruction.test.ts \
            tests/unit/call-solana-program.test.ts
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Commit exact verified tree
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pr2372-final-hardening-rerun.yml
          git config user.name "Vaibhav Lalwani"
          git config user.email "115102797+vaibhav4046@users.noreply.github.com"
          git add \
            app/api/execute/node/route.ts \
            app/api/execute/_lib/execution-service.ts \
            plugins/web3/steps/send-raw-solana-instruction-core.ts \
            plugins/web3/steps/call-solana-program-core.ts \
            plugins/web3/steps/write-contract-core.ts \
            tests/integration/execute-node-reserved-fields.test.ts \
            tests/unit/execution-service-safe-inner-failure.test.ts \
            tests/unit/send-raw-solana-instruction.test.ts \
            tests/unit/call-solana-program.test.ts \
            specs/api-coverage.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: close final idempotency review gaps"
          git push --force origin HEAD:automation/pr2372-final-hardening-result-20260917
