name: PR 2372 node evidence final v2
on:
  push:
    branches: [automation/pr2372-node-evidence-final]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact reviewer fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/execute/node/route.ts'); s=p.read_text()
          a='''const disposition = transactionHash\n      ? dispositionForExecutionOutcome(settled.status)\n      : "failed";'''
          b='''const disposition = transactionHash\n      ? dispositionForExecutionOutcome(settled.status, { transactionHash })\n      : "failed";'''
          c='''const disposition = completeParams.transactionHash\n      ? dispositionForExecutionOutcome(outcome.status)\n      : "failed";'''
          d='''const disposition = completeParams.transactionHash\n      ? dispositionForExecutionOutcome(outcome.status, {\n          transactionHash: completeParams.transactionHash,\n        })\n      : "failed";'''
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
      - run: pnpm exec vitest run tests/unit/idempotency-disposition-evidence.test.ts tests/unit/execute-protocol-idempotency-disposition.test.ts tests/unit/execution-service-safe-inner-failure.test.ts
      - run: pnpm exec tsgo --noEmit
      - run: pnpm exec biome check app/api/execute/node/route.ts
      - name: Commit verified patch only
        run: |
          rm .github/workflows/pr2372-node-evidence-final.yml .github/workflows/pr2372-node-evidence-final-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/execute/node/route.ts .github/workflows/pr2372-node-evidence-final.yml .github/workflows/pr2372-node-evidence-final-v2.yml
          git commit -m "fix: pass node transaction hash to idempotency disposition"
          git push origin HEAD:automation/pr2372-node-evidence-final
