name: PR 2372 final contributor verification

on:
  push:
    branches:
      - automation/pr2372-finalverify-f88cba6

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f88cba617f239b8c396eb91f5ed385518242feb5
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate plugin registry
        run: pnpm discover-plugins
      - name: Reproduce full-suite regression directly
        run: pnpm vitest run tests/unit/execute-protocol-required-params.test.ts --reporter=verbose
