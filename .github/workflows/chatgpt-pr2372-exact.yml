name: PR 2372 publish exact review fix

on:
  push:
    branches:
      - chatgpt-pr2372-runner

permissions:
  contents: write

jobs:
  publish-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - name: Reconstruct and publish exact review fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/vaibhav4046/keeperhub.git" work
          cd work
          git fetch origin fix/issue-1840-release-key-on-definite-failure
          PUBLISHED_HEAD="$(git rev-parse origin/fix/issue-1840-release-key-on-definite-failure)"
          test "$PUBLISHED_HEAD" = "439bfed6f8b9d036eb8d698a8ad5844ba58a149a"
          git checkout --detach "$PUBLISHED_HEAD"

          python - <<'PY'
          import base64, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('../payload/.chatgpt-pr2372/review-fix-manifest.json').read_text())
          def read_varint(data, pos):
              value = 0; shift = 0
              while True:
                  b = data[pos]; pos += 1
                  value |= (b & 0x7f) << shift
                  if not (b & 0x80): return value, pos
                  shift += 7
          def apply_delta(base, delta):
              pos = 0
              base_size, pos = read_varint(delta, pos)
              result_size, pos = read_varint(delta, pos)
              if base_size != len(base): raise RuntimeError('base size mismatch')
              out = bytearray()
              while pos < len(delta):
                  op = delta[pos]; pos += 1
                  if op & 0x80:
                      off = size = 0
                      if op & 1: off |= delta[pos]; pos += 1
                      if op & 2: off |= delta[pos] << 8; pos += 1
                      if op & 4: off |= delta[pos] << 16; pos += 1
                      if op & 8: off |= delta[pos] << 24; pos += 1
                      if op & 16: size |= delta[pos]; pos += 1
                      if op & 32: size |= delta[pos] << 8; pos += 1
                      if op & 64: size |= delta[pos] << 16; pos += 1
                      if size == 0: size = 0x10000
                      out += base[off:off+size]
                  elif op:
                      out += delta[pos:pos+op]; pos += op
                  else: raise RuntimeError('invalid delta opcode')
              if len(out) != result_size: raise RuntimeError('result size mismatch')
              return bytes(out)
          for e in manifest:
              p = pathlib.Path(e['path']); p.parent.mkdir(parents=True, exist_ok=True)
              if 'full' in e:
                  content = base64.b64decode(e['full'])
              else:
                  current = subprocess.check_output(['git','hash-object',e['path']], text=True).strip()
                  if current != e['base']: raise RuntimeError(f"base guard failed: {e['path']}")
                  base = subprocess.check_output(['git','cat-file','blob',e['base']])
                  content = apply_delta(base, base64.b64decode(e['delta']))
              p.write_bytes(content)
              if 'target' in e:
                  actual = subprocess.check_output(['git','hash-object',e['path']], text=True).strip()
                  if actual != e['target']: raise RuntimeError(f"target guard failed: {e['path']}")
          PY

          git diff --check
          git add \
            lib/tempo/broadcast-due.ts \
            lib/tempo/held-payments.ts \
            lib/web3/chain-adapter/evm.ts \
            lib/web3/submit-signed.ts \
            plugins/tempo/steps/tempo-tx-core.ts \
            tests/unit/tempo-broadcast-due.test.ts \
            tests/unit/submit-signed.test.ts \
            tests/unit/evm-chain-adapter-tempo-confirm.test.ts \
            tests/unit/broadcast-attempted-core-evidence.test.ts
          test "$(git write-tree)" = "9c0007acff04cba7c8d9f9636048ce145f56c735"
          cat > /tmp/review-commit.txt <<EOF
          tree 9c0007acff04cba7c8d9f9636048ce145f56c735
          parent 439bfed6f8b9d036eb8d698a8ad5844ba58a149a
          author Instinct Agent <agent@instinct.com> 1790116743 +0100
          committer Instinct Agent <agent@instinct.com> 1790116743 +0100

          fix: settle requested broadcast review gaps
          EOF
          REVIEW_COMMIT="$(git hash-object -t commit -w /tmp/review-commit.txt)"
          test "$REVIEW_COMMIT" = "6e356165ff976dc027fb507bdedc6b21607e33df"
          git reset --hard "$REVIEW_COMMIT"
          git fetch origin fix/issue-1840-release-key-on-definite-failure
          test "$(git rev-parse FETCH_HEAD)" = "$PUBLISHED_HEAD"
          git push origin HEAD:fix/issue-1840-release-key-on-definite-failure
