name: PR 2372 Hardening

on:
  push:
    branches: [automation/pr-2372-hardening]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-1840-release-key-on-definite-failure
          fetch-depth: 0

      - name: Rebase onto current upstream staging
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KeeperHub/keeperhub.git || true
          git fetch upstream staging
          git rebase upstream/staging

      - name: Apply broadcast-evidence hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)
              changed.append(path)

          def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 exact match, found {count}: {old[:120]!r}")
              save(path, text.replace(old, new, 1))

          def add_import(path, statement):
              text = load(path)
              if statement in text:
                  return
              marker = 'import "server-only";\n'
              if marker not in text:
                  raise SystemExit(f"{path}: missing server-only marker")
              save(path, text.replace(marker, marker + statement + "\n", 1))

          def wrap_exported_async(path, fn, input_type, result_type):
              text = load(path)
              needle = f"export async function {fn}("
              if text.count(needle) != 1:
                  raise SystemExit(f"{path}: expected one exported {fn}")
              text = text.replace(needle, f"async function {fn}Impl(", 1)
              wrapper = f'''\n\nexport async function {fn}(\n  input: {input_type}\n): Promise<{result_type}> {{\n  const result = await {fn}Impl(input);\n  if (result.success || result.broadcastAttempted !== undefined) {{\n    return result;\n  }}\n  return {{ ...result, broadcastAttempted: false }};\n}}\n'''
              text = text.rstrip() + wrapper
              save(path, text)

          # Central rule: unknown hashless failures fail closed. Only explicit
          # pre-broadcast evidence releases; known-hash terminal failures release.
          replace_once(
              "lib/idempotency-disposition.ts",
              '''  if (status === "completed") return "success";\n  if (status === "unconfirmed") return "failed";\n  if (\n    !evidence?.transactionHash &&\n    (evidence?.broadcastAttempted === true || evidence?.sponsored === true)\n  ) {\n    return "failed";\n  }\n  return "release";''',
              '''  if (status === "completed") return "success";\n  if (status === "unconfirmed") return "failed";\n\n  // A known transaction hash means finalization reconciled a concrete chain\n  // outcome. A terminal failed outcome is safe to retry with the same key.\n  if (evidence?.transactionHash) return "release";\n\n  // Sponsored submission without a hash is still potentially in flight.\n  if (evidence?.sponsored === true) return "failed";\n\n  // Release only when the broadcaster explicitly proves it never attempted a\n  // send. Missing evidence fails closed so a newly added write core cannot\n  // accidentally become retryable after an ambiguous hashless failure.\n  if (evidence?.broadcastAttempted === false) return "release";\n  return "failed";'''
          )

          replace_once(
              "lib/web3/submit-signed.ts",
              "function isDefinitelyPreBroadcastNetworkError(error: unknown): boolean {",
              "export function isDefinitelyPreBroadcastNetworkError(error: unknown): boolean {"
          )

          # Update the focused disposition matrix.
          save("tests/unit/idempotency-disposition-evidence.test.ts", '''import { describe, expect, it } from "vitest";\nimport { dispositionForExecutionOutcome } from "@/lib/idempotency-disposition";\n\ndescribe("idempotency disposition execution evidence", () => {\n  it("fails closed for a failed execution with no broadcast evidence", () => {\n    expect(dispositionForExecutionOutcome("failed")).toBe("failed");\n  });\n\n  it("releases a failed execution only with explicit pre-broadcast evidence", () => {\n    expect(\n      dispositionForExecutionOutcome("failed", { broadcastAttempted: false })\n    ).toBe("release");\n  });\n\n  it("retains a failed execution when a broadcast was attempted without a hash", () => {\n    expect(\n      dispositionForExecutionOutcome("failed", { broadcastAttempted: true })\n    ).toBe("failed");\n  });\n\n  it("retains a failed sponsored execution without a hash", () => {\n    expect(dispositionForExecutionOutcome("failed", { sponsored: true })).toBe(\n      "failed"\n    );\n  });\n\n  it("releases a reconciled terminal failure that carries a transaction hash", () => {\n    expect(\n      dispositionForExecutionOutcome("failed", {\n        transactionHash: `0x${"11".repeat(32)}`,\n        broadcastAttempted: true,\n      })\n    ).toBe("release");\n  });\n\n  it("retains unconfirmed outcomes regardless of evidence", () => {\n    expect(\n      dispositionForExecutionOutcome("unconfirmed", { broadcastAttempted: false })\n    ).toBe("failed");\n  });\n});\n''')

          network_import = 'import { isDefinitelyPreBroadcastNetworkError } from "@/lib/web3/submit-signed";'

          # Existing EVM cores: make all pre-send returns explicit false via a
          # wrapper, and make the send catch true unless we can mechanically\n          # prove static-call rejection or all-endpoint connection refusal.
          for path, fn, input_t, result_t in [
              ("plugins/web3/steps/transfer-token-core.ts", "transferTokenCore", "TransferTokenCoreInput", "TransferTokenResult"),
              ("plugins/web3/steps/write-contract-core.ts", "writeContractCore", "WriteContractCoreInput", "WriteContractResult"),
              ("plugins/web3/steps/approve-token-core.ts", "approveTokenCore", "ApproveTokenCoreInput", "ApproveTokenResult"),
          ]:
              add_import(path, network_import)
              text = load(path)
              if "broadcastAttempted?: boolean;" not in text:
                  marker = "      sponsored?: boolean;\n    };"
                  if marker not in text:
                      raise SystemExit(f"{path}: failure evidence insertion marker missing")
                  text = text.replace(marker, "      sponsored?: boolean;\n      broadcastAttempted?: boolean;\n    };", 1)
                  save(path, text)
              # Sponsored terminal errors already mean a send happened. Approve
              # was the one sponsored core not forwarding the resolver evidence.
              if path.endswith("approve-token-core.ts"):
                  text = load(path)
                  old = "          sponsored: true,\n          ...(decision.transactionHash"
                  new = "          sponsored: true,\n          broadcastAttempted: decision.broadcastAttempted,\n          ...(decision.transactionHash"
                  if old not in text:
                      raise SystemExit(f"{path}: sponsored decision marker missing")
                  save(path, text.replace(old, new, 1))
              text = load(path)
              marker = "        ...(broadcastTransactionHash(error)\n          ? { transactionHash: broadcastTransactionHash(error), chainId }\n          : {}),"
              if marker not in text:
                  raise SystemExit(f"{path}: direct catch hash marker missing")
              evidence = '''        broadcastAttempted:\n          broadcastTransactionHash(error)\n            ? true\n            : rejection.kind !== "unknown" ||\n                isDefinitelyPreBroadcastNetworkError(error)\n              ? false\n              : true,\n'''
              save(path, text.replace(marker, evidence + marker, 1))
              wrap_exported_async(path, fn, input_t, result_t)

          # Native transfer EVM core plus its Solana branch.
          path = "plugins/web3/steps/transfer-funds-core.ts"
          add_import(path, network_import)
          text = load(path)
          marker = "        ...(broadcastTransactionHash(error)\n          ? { transactionHash: broadcastTransactionHash(error), chainId }\n          : {}),"
          if marker not in text:
              raise SystemExit(f"{path}: EVM catch marker missing")
          evidence = '''        broadcastAttempted:\n          broadcastTransactionHash(error)\n            ? true\n            : rejection.kind !== "unknown" ||\n                isDefinitelyPreBroadcastNetworkError(error)\n              ? false\n              : true,\n'''
          text = text.replace(marker, evidence + marker, 1)
          sol_old = '''    return {\n      success: false,\n      error: getErrorMessage(error),\n    };\n  }\n}'''
          sol_new = '''    return {\n      success: false,\n      error: getErrorMessage(error),\n      // Reaching SolanaChainAdapter.sendTransaction means signed bytes may\n      // already have reached the cluster even when no signature is returned.\n      broadcastAttempted: true,\n    };\n  }\n}'''
          if sol_old not in text:
              raise SystemExit(f"{path}: Solana send catch marker missing")
          text = text.replace(sol_old, sol_new, 1)
          save(path, text)
          wrap_exported_async(path, "transferFundsCore", "TransferFundsCoreInput", "TransferFundsResult")

          # Batch write: same deterministic EVM send contract as the single-write cores.
          path = "plugins/web3/steps/batch-write-contract-core.ts"
          add_import(path, network_import)
          text = load(path)
          type_marker = "    chainId?: number;\n    // Present when the pre-broadcast simulation ran"
          if type_marker not in text:
              raise SystemExit(f"{path}: result type marker missing")
          text = text.replace(type_marker, "    chainId?: number;\n    broadcastAttempted?: boolean;\n    // Present when the pre-broadcast simulation ran", 1)
          base_marker = '''        ...(broadcastHash ? { transactionHash: broadcastHash, chainId } : {}),\n        ...(rejection.kind !== "unknown" ? { rejection } : {}),'''
          if base_marker not in text:
              raise SystemExit(f"{path}: catch base marker missing")
          base_new = '''        ...(broadcastHash ? { transactionHash: broadcastHash, chainId } : {}),\n        broadcastAttempted: broadcastHash\n          ? true\n          : rejection.kind !== "unknown" ||\n              isDefinitelyPreBroadcastNetworkError(error)\n            ? false\n            : true,\n        ...(rejection.kind !== "unknown" ? { rejection } : {}),'''
          save(path, text.replace(base_marker, base_new, 1))
          wrap_exported_async(path, "batchWriteContractCore", "BatchWriteContractCoreInput", "BatchWriteContractResult")

          # Robinhood write: add the same explicit evidence contract.
          path = "plugins/robinhood/steps/trade-stock-token-core.ts"
          add_import(path, network_import)
          add_import(path, 'import { classifyRevert } from "@/lib/web3/decode-revert-error";')
          text = load(path)
          type_marker = "      transactionHash?: string;\n      chainId?: number;\n    };"
          if type_marker not in text:
              raise SystemExit(f"{path}: failure type marker missing")
          text = text.replace(type_marker, "      transactionHash?: string;\n      chainId?: number;\n      broadcastAttempted?: boolean;\n    };", 1)
          old = '''  } catch (error) {\n    logUserError(\n      ErrorCategory.TRANSACTION,\n      "[Trade Stock Token] Swap failed",\n      error,\n      { plugin_name: "robinhood", action_name: "trade-stock-token" }\n    );\n    return {\n      success: false,\n      error: getErrorMessage(error),\n      ...(broadcastTransactionHash(error)\n        ? { transactionHash: broadcastTransactionHash(error), chainId }\n        : {}),\n    };\n  }\n}'''
          new = '''  } catch (error) {\n    logUserError(\n      ErrorCategory.TRANSACTION,\n      "[Trade Stock Token] Swap failed",\n      error,\n      { plugin_name: "robinhood", action_name: "trade-stock-token" }\n    );\n    const broadcastHash = broadcastTransactionHash(error);\n    const rejection = classifyRevert(error, new ethers.Interface(UNIVERSAL_ROUTER_ABI));\n    return {\n      success: false,\n      error: getErrorMessage(error),\n      broadcastAttempted: broadcastHash\n        ? true\n        : rejection.kind !== "unknown" ||\n            isDefinitelyPreBroadcastNetworkError(error)\n          ? false\n          : true,\n      ...(broadcastHash ? { transactionHash: broadcastHash, chainId } : {}),\n    };\n  }\n}'''
          if old not in text:
              raise SystemExit(f"{path}: trade catch marker missing")
          save(path, text.replace(old, new, 1))
          wrap_exported_async(path, "tradeStockTokenCore", "TradeStockTokenCoreInput", "TradeStockTokenResult")

          # SPL transfer: all preflight failures default false; once sendTransaction
          # is entered, a hashless error is conservatively a possible broadcast.
          path = "plugins/web3/steps/transfer-spl-token-core.ts"
          text = load(path)
          old_type = '  | { success: false; error: string };'
          if old_type not in text:
              raise SystemExit(f"{path}: failure type marker missing")
          text = text.replace(old_type, '  | { success: false; error: string; broadcastAttempted?: boolean };', 1)
          old_catch = '    return { success: false, error: getErrorMessage(error) };\n  }\n}\n\nexport async function transferSplTokenCore('
          new_catch = '    return { success: false, error: getErrorMessage(error), broadcastAttempted: true };\n  }\n}\n\nexport async function transferSplTokenCore('
          if old_catch not in text:
              raise SystemExit(f"{path}: send catch marker missing")
          save(path, text.replace(old_catch, new_catch, 1))
          wrap_exported_async(path, "transferSplTokenCore", "TransferSplTokenCoreInput", "TransferSplTokenResult")

          # Tempo signs before sending, so its deterministic signed hash can be
          # carried through lost replies and confirmation timeouts.
          path = "plugins/tempo/steps/tempo-tx-core.ts"
          add_import(path, 'import { OnChainPendingError, OnChainRevertError } from "@/lib/web3/onchain-revert";')
          add_import(path, network_import)
          text = load(path)
          old_hash_check = '''  if (expectedHash) {\n    const actual = TxEnvelopeTempo.hash(envelope as TxEnvelopeTempo.Signed);\n    if (actual.toLowerCase() !== expectedHash.toLowerCase()) {'''
          new_hash_check = '''  const actualHash = TxEnvelopeTempo.hash(envelope as TxEnvelopeTempo.Signed);\n  if (expectedHash) {\n    if (actualHash.toLowerCase() !== expectedHash.toLowerCase()) {'''
          if old_hash_check not in text:
              raise SystemExit(f"{path}: hash verification marker missing")
          text = text.replace(old_hash_check, new_hash_check, 1)
          old_throw = '''    throw error;\n  }\n\n  if (!waitForConfirmation) {\n    return { hash, confirmed: false };\n  }\n\n  const receipt = await waitForReceipt(rpcManager, hash);\n  if (receipt.status === 0) {\n    throw new Error(`Tempo transaction reverted (${hash})`);\n  }'''
          new_throw = '''    if (isDefinitelyPreBroadcastNetworkError(error)) {\n      throw error;\n    }\n    throw new OnChainPendingError({\n      message: `Tempo transaction send outcome could not be determined (${message})`,\n      transactionHash: actualHash,\n    });\n  }\n\n  if (!waitForConfirmation) {\n    return { hash, confirmed: false };\n  }\n\n  let receipt: ethers.TransactionReceipt;\n  try {\n    receipt = await waitForReceipt(rpcManager, hash);\n  } catch (error) {\n    throw new OnChainPendingError({\n      message: getErrorText(error),\n      transactionHash: actualHash,\n    });\n  }\n  if (receipt.status === 0) {\n    throw new OnChainRevertError({\n      message: `Tempo transaction reverted (${hash})`,\n      transactionHash: actualHash,\n      blockNumber: receipt.blockNumber,\n    });\n  }'''
          if old_throw not in text:
              raise SystemExit(f"{path}: broadcast error marker missing")
          text = text.replace(old_throw, new_throw, 1)
          # Keep this core standalone: avoid importing app-level getErrorMessage.
          helper = '''\nfunction getErrorText(error: unknown): string {\n  return error instanceof Error ? error.message : String(error);\n}\n'''
          insert_before = '\nexport type TempoReceiptStatus = "confirmed" | "reverted" | "pending";'
          if insert_before not in text:
              raise SystemExit(f"{path}: helper insertion marker missing")
          text = text.replace(insert_before, helper + insert_before, 1)
          old_call = '''    serialized: signed.serialized,\n    waitForConfirmation: true,'''
          new_call = '''    serialized: signed.serialized,\n    expectedHash: signed.hash,\n    waitForConfirmation: true,'''
          if old_call not in text:
              raise SystemExit(f"{path}: sign/broadcast expectedHash marker missing")
          save(path, text.replace(old_call, new_call, 1))

          # Tempo action results: wrapper marks all validation/pre-sign failures
          # explicitly false; catches preserve a deterministic hash for anything
          # that might have been broadcast.
          for path, fn, input_t, result_t in [
              ("plugins/tempo/steps/transfer-with-memo.ts", "stepHandler", "TransferWithMemoInput", "TransferWithMemoResult"),
              ("plugins/tempo/steps/dex-swap.ts", "stepHandler", "DexSwapInput", "DexSwapResult"),
              ("plugins/tempo/steps/batch-payout.ts", "stepHandler", "BatchPayoutInput", "BatchPayoutResult"),
          ]:
              add_import(path, 'import { broadcastTransactionHash } from "@/lib/web3/onchain-revert";')
              text = load(path)
              # Enrich the compact failure variant.
              m = re.search(r'\| \{ success: false; error: string \};', text)
              if not m:
                  raise SystemExit(f"{path}: compact failure type missing")
              text = text[:m.start()] + '| {\n      success: false;\n      error: string;\n      transactionHash?: string;\n      chainId?: number;\n      broadcastAttempted?: boolean;\n    };' + text[m.end():]
              # Keep a hash outside the try so post-broadcast decoration failures
              # cannot erase evidence that a transaction already exists.
              try_marker = '  try {\n    const rpcManager = await getRpcProvider({' 
              if try_marker not in text:
                  raise SystemExit(f"{path}: main try marker missing")
              text = text.replace(try_marker, '  let broadcastHash: string | undefined;\n\n  try {\n    const rpcManager = await getRpcProvider({', 1)
              assign_marker = '    const { hash, from } = await signAndBroadcastTempoTx({' 
              if assign_marker not in text:
                  raise SystemExit(f"{path}: broadcast assignment marker missing")
              text = text.replace(assign_marker, '    const { hash, from } = await signAndBroadcastTempoTx({', 1)
              # Assign immediately after the call's closing `});` by targeting
              # the first transactionLink/build response statement after it.
              after_patterns = [
                  '\n\n    const transactionLink = await buildTempoTxLink(chainId, hash);',
                  '\n\n    return {\n      success: true,\n      transactionHash: hash,',
              ]
              placed = False
              for ap in after_patterns:
                  if ap in text:
                      text = text.replace(ap, '\n    broadcastHash = hash;' + ap, 1)
                      placed = True
                      break
              if not placed:
                  raise SystemExit(f"{path}: post-broadcast marker missing")
              # Replace the terminal catch return only; wrappers handle all
              # earlier failure returns as explicit pre-broadcast false.
              catch_return = '    return { success: false, error: getErrorMessage(error) };'
              if catch_return not in text:
                  raise SystemExit(f"{path}: catch return marker missing")
              replacement = '''    const transactionHash = broadcastHash ?? broadcastTransactionHash(error);\n    return {\n      success: false,\n      error: getErrorMessage(error),\n      broadcastAttempted: transactionHash ? true : false,\n      ...(transactionHash ? { transactionHash, chainId } : {}),\n    };'''
              text = text.replace(catch_return, replacement, 1)
              # Rename the internal handler then add evidence-normalizing wrapper
              # before the exported workflow step, because stepHandler itself is
              # intentionally not exported.
              decl = f"async function {fn}(input: {input_t}): Promise<{result_t}> {{"
              if decl not in text:
                  raise SystemExit(f"{path}: handler declaration missing")
              text = text.replace(decl, f"async function {fn}Impl(input: {input_t}): Promise<{result_t}> {{", 1)
              export_marker = '\nexport async function '
              pos = text.find(export_marker)
              if pos < 0:
                  raise SystemExit(f"{path}: exported step marker missing")
              wrapper = f'''\nasync function {fn}(input: {input_t}): Promise<{result_t}> {{\n  const result = await {fn}Impl(input);\n  if (result.success || result.broadcastAttempted !== undefined) {{\n    return result;\n  }}\n  return {{ ...result, broadcastAttempted: false }};\n}}\n'''
              text = text[:pos] + wrapper + text[pos:]
              save(path, text)

          # Transfer route no longer needs a Solana-only idempotency special case:
          # SPL/native Solana send boundaries now carry explicit evidence.
          replace_once(
              "app/api/execute/transfer/route.ts",
              '''  const disposition =\n    isSolanaTransfer && !result.transactionHash\n      ? "failed"\n      : dispositionForExecutionOutcome(outcome.status, result);''',
              '''  const disposition = dispositionForExecutionOutcome(outcome.status, result);'''
          )

          # Static coverage guard: every broadcaster named in the review must
          # carry the field in source, and the route special case must stay gone.
          save("tests/unit/idempotency-broadcast-evidence-coverage.test.ts", '''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst ROOT = process.cwd();\nconst broadcasters = [\n  "plugins/web3/steps/transfer-funds-core.ts",\n  "plugins/web3/steps/transfer-token-core.ts",\n  "plugins/web3/steps/write-contract-core.ts",\n  "plugins/web3/steps/approve-token-core.ts",\n  "plugins/web3/steps/batch-write-contract-core.ts",\n  "plugins/robinhood/steps/trade-stock-token-core.ts",\n  "plugins/web3/steps/transfer-spl-token-core.ts",\n  "plugins/tempo/steps/tempo-tx-core.ts",\n];\n\ndescribe("idempotency broadcast evidence coverage", () => {\n  for (const file of broadcasters) {\n    it(`${file} preserves broadcast evidence`, () => {\n      const source = fs.readFileSync(path.join(ROOT, file), "utf8");\n      expect(source).toContain("broadcastAttempted");\n    });\n  }\n\n  it("the transfer route relies on shared evidence rather than a Solana exception", () => {\n    const source = fs.readFileSync(\n      path.join(ROOT, "app/api/execute/transfer/route.ts"),\n      "utf8"\n    );\n    expect(source).not.toContain("isSolanaTransfer && !result.transactionHash");\n  });\n});\n''')

          print("changed files:")
          for p in sorted(set(changed)):
              print(p)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint changed source
        run: |
          pnpm exec biome check --write \
            lib/idempotency-disposition.ts \
            lib/web3/submit-signed.ts \
            app/api/execute/transfer/route.ts \
            plugins/web3/steps/transfer-funds-core.ts \
            plugins/web3/steps/transfer-token-core.ts \
            plugins/web3/steps/write-contract-core.ts \
            plugins/web3/steps/approve-token-core.ts \
            plugins/web3/steps/batch-write-contract-core.ts \
            plugins/web3/steps/transfer-spl-token-core.ts \
            plugins/robinhood/steps/trade-stock-token-core.ts \
            plugins/tempo/steps/tempo-tx-core.ts \
            plugins/tempo/steps/transfer-with-memo.ts \
            plugins/tempo/steps/dex-swap.ts \
            plugins/tempo/steps/batch-payout.ts \
            tests/unit/idempotency-disposition-evidence.test.ts \
            tests/unit/idempotency-broadcast-evidence-coverage.test.ts

      - name: Focused safety tests
        run: |
          pnpm vitest run \
            tests/unit/idempotency-disposition-evidence.test.ts \
            tests/unit/idempotency-broadcast-evidence-coverage.test.ts \
            tests/unit/submit-signed-failover.test.ts \
            tests/unit/tempo-transfer-with-memo.test.ts \
            tests/unit/tempo-dex-swap.test.ts \
            tests/unit/tempo-batch-payout.test.ts

      - name: Broad issue-1840 regression tests
        run: |
          pnpm vitest run tests/unit --testNamePattern='idempot|broadcast|transfer|write contract|approve|safe|tempo|solana' --passWithNoTests

      - name: Typecheck
        run: pnpm type-check

      - name: API docs validation
        run: pnpm check:api-docs

      - name: Biome check
        run: pnpm check

      - name: Verify safety diff and squash onto staging
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain | grep '^?? .github/workflows/pr-2372-hardening.yml' || true)"
          git diff --stat upstream/staging
          git diff upstream/staging -- .github/workflows | grep -q . && { echo 'unexpected workflow diff'; exit 1; } || true
          git config user.name "vaibhav4046"
          git config user.email "vaibhav4046@users.noreply.github.com"
          git reset --soft upstream/staging
          git add -A
          git commit -m "fix: make idempotency broadcast evidence fail closed"

      - name: Push verified target branch
        run: git push --force-with-lease origin HEAD:fix/issue-1840-release-key-on-definite-failure
